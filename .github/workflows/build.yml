name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "目标固件 (ImmortalWrt 走 master 分支, OpenWrt 走 openwrt 分支)"
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      version:
        description: "固件版本号 (以 25.12.x 为例, 可选项以官方已发布的 ImageBuilder 为准, 构建前会校验)"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - 25.12.3
          - 25.12.4
          - 25.12.5
      output_format:
        description: "输出格式"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - iso
      custom_router_ip:
        description: "路由器管理地址 (仅多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      profile:
        description: "固件大小 单位(MB)"
        required: true
        default: '1024'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          PROFILE: ${{ inputs.profile }}
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          if ! [[ "$PROFILE" =~ ^[0-9]+$ ]]; then
            echo "Error: profile 必须是数字 (MB)，不支持逗号分隔多尺寸"
            exit 1
          fi
          if ! [[ "$CUSTOM_ROUTER_IP" =~ ^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$ ]]; then
            echo "Error: custom_router_ip 必须是合法 IPv4 地址 (每段 0-255), 如 192.168.1.1"
            exit 1
          fi
          if [[ "$ENABLE_PPPOE" == "yes" ]]; then
            if [[ -z "$PPPOE_ACCOUNT" || -z "$PPPOE_PASSWORD" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
            # 黑名单校验: 仅拦截会破坏 shell source/uci 赋值的空白与 shell 元字符;
            # 其余字符(含中文等非 ASCII)放行, 避免误伤真实宽带账号
            BAD_CHARS=$(printf ' \t\n"\047\140$&|;<>()\134')
            check_pppoe_value() {
              local v="$1" label="$2" c i
              for ((i=0; i<${#BAD_CHARS}; i++)); do
                c="${BAD_CHARS:i:1}"
                if [[ "$v" == *"$c"* ]]; then
                  echo "Error: $label 含不允许的字符 (空白或 shell 元字符)"
                  exit 1
                fi
              done
            }
            check_pppoe_value "$PPPOE_ACCOUNT" pppoe_account
            check_pppoe_value "$PPPOE_PASSWORD" pppoe_password
            # 将密码加入日志脱敏
            echo "::add-mask::$PPPOE_PASSWORD"
          fi

      - name: Save Custom Router IP
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          printf '%s\n' "$CUSTOM_ROUTER_IP" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Build firmware
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          case "$TARGET" in
            immortalwrt)
              BRANCH=master
              IB_BASE=https://downloads.immortalwrt.org/releases
              IB_NAME="immortalwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
              CONFIG=x86-64/imm.config
              RELEASE_TAG=Autobuild-x86-64
              ISO_TAG=Custom-Installer-x86_64-ISO
              ;;
            openwrt)
              BRANCH=openwrt
              IB_BASE=https://downloads.openwrt.org/releases
              IB_NAME="openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
              CONFIG=x86-64/openwrt.config
              RELEASE_TAG=Autobuild-OpenWrt-x86-64
              ISO_TAG=OpenWrt-Installer-x86_64-ISO
              ;;
            *)
              echo "Error: unknown target '$TARGET'"
              exit 1
              ;;
          esac

          # 直接以 workspace 为工作目录: tarball 没有顶层 bin/, 用 --strip-components=1
          # 解到根目录后, 固件输出落在 ${GITHUB_WORKSPACE}/bin/targets/x86/64/,
          # 与后续上传/打包 ISO 步骤的路径保持一致
          WORK_DIR="${{ github.workspace }}"
          IB_URL="$IB_BASE/$VERSION/targets/x86/64/$IB_NAME"

          # 上游只对已发布版本提供 ImageBuilder tarball; 不存在时给出明确提示
          # (此前用 docker hub 的点版本 tag 判断, 但该镜像已停止跟进新版发布)
          if ! curl -fsIL --retry 3 --retry-delay 2 -o /dev/null "$IB_URL"; then
            echo "Error: 找不到 ImageBuilder: $IB_URL"
            echo "请确认版本号 '$VERSION' 对 target=$TARGET 是否已发布"
            exit 1
          fi

          # 先切到目标分支, 后续从该分支读取平台配置与定制脚本
          git checkout "$BRANCH"

          # 校验目标分支源码文件存在
          for src in "$CONFIG" x86-64/build.sh shell/custom-packages.sh shell/prepare-packages.sh files/etc/uci-defaults/99-custom.sh; do
            if [ ! -f "$src" ]; then
              echo "Error: $src 在 $BRANCH 分支不存在, 目标分支与 workflow 不匹配"
              exit 1
            fi
          done

          echo "Target: $TARGET | Branch: $BRANCH | Version: $VERSION"
          echo "ImageBuilder: $IB_URL"
          echo "Building for profile: $PROFILE (work_dir=$WORK_DIR)"

          curl -fL --retry 3 --retry-delay 2 -o "$IB_NAME" "$IB_URL"

          # 供应链校验: 优先用官方 sha256sums, 缺失时退化为记录实际摘要
          if curl -fsSL -o sha256sums "$IB_BASE/$VERSION/targets/x86/64/sha256sums"; then
            expected=$(awk -v f="$IB_NAME" '$2 == f || $2 == "*" f {print $1; exit}' sha256sums)
            if [ -z "$expected" ]; then
              echo "⚠️ sha256sums 中未列出 $IB_NAME, 跳过校验 (实际: $(sha256sum "$IB_NAME" | cut -d' ' -f1))"
            else
              actual=$(sha256sum "$IB_NAME" | cut -d' ' -f1)
              if [ "$actual" != "$expected" ]; then
                echo "Error: ImageBuilder 校验和不匹配"
                echo "  expected: $expected"
                echo "  actual  : $actual"
                exit 1
              fi
              echo "✅ ImageBuilder sha256 校验通过"
            fi
          else
            echo "⚠️ 未找到 sha256sums, 跳过校验 (tarball 实际 sha256: $(sha256sum "$IB_NAME" | cut -d' ' -f1))"
          fi

          # 解包到 workspace 根目录: tarball 没有顶层 bin/, 解出的内容与仓库文件互补,
          # 不会覆盖 shell/ 与 files/ (那两个目录只在仓库里)
          tar --zstd -xf "$IB_NAME" --strip-components=1
          if [ ! -f Makefile ] || [ ! -d include ]; then
            echo "Error: ImageBuilder 解包失败, 未找到 Makefile/include"
            ls -la
            exit 1
          fi
          rm -f "$IB_NAME" sha256sums

          mkdir -p bin
          cp x86-64/build.sh build.sh
          # 用仓库内的平台配置覆盖 tarball 自带默认 .config (过滤掉会触发重编译的开发选项)
          grep -vE '^CONFIG_(DEVEL|AUTOREBUILD|AUTOREMOVE|BUILD_LOG|CCACHE)' "$CONFIG" > .config

          # 敏感信息(PPPoE 密码)走 env 文件, 避免出现在命令行/日志
          # trap 兜底: 构建失败时也确保删除明文文件
          trap 'rm -f "$WORK_DIR/.build.env"' EXIT
          {
            printf 'ROOTFS_PARTSIZE=%s\n' "$PROFILE"
            printf 'BUILD_VERSION=%s\n' "$VERSION"
            printf 'INCLUDE_DOCKER=%s\n' "$INCLUDE_DOCKER"
            printf 'ENABLE_PPPOE=%s\n' "$ENABLE_PPPOE"
            printf 'PPPOE_ACCOUNT=%s\n' "$PPPOE_ACCOUNT"
            printf 'PPPOE_PASSWORD=%s\n' "$PPPOE_PASSWORD"
          } > "$WORK_DIR/.build.env"

          set -a
          # shellcheck disable=SC1090
          . "$WORK_DIR/.build.env"
          set +a

          bash "$WORK_DIR/build.sh"
          rm -f "$WORK_DIR/.build.env"

          # 传递 tag 给后续步骤
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Create info
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          VERSION: ${{ inputs.version }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: https://$CUSTOM_ROUTER_IP (nginx 主入口, 自签证书)
          - 🔗 **备用入口**: http://$CUSTOM_ROUTER_IP:8080 (uhttpd)
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **版本**: $VERSION (${{ env.TARGET }})
          EOF

          if [ "$INCLUDE_DOCKER" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload firmware as release (img)
        if: inputs.output_format == 'img'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy firmware for ISO
        if: inputs.output_format == 'iso'
        run: cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}/

      - name: Upload firmware artifact (for ISO)
        if: inputs.output_format == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: "*.img.gz"

  build_iso:
    runs-on: ubuntu-22.04
    needs: build
    if: inputs.output_format == 'iso'

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      - name: Clone img-installer (pinned)
        run: |
          # 供应链加固: 锁定到指定 commit, 升级时更新 SHA (git ls-remote https://github.com/wukongdaily/img-installer.git master)
          IMG_INSTALLER_REF=361ea6138094a2417e62edd01f73fa1160e93e01
          git clone --depth=1 https://github.com/wukongdaily/img-installer.git
          git -C img-installer fetch --depth=1 origin "$IMG_INSTALLER_REF"
          git -C img-installer checkout --detach "$IMG_INSTALLER_REF"

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: Build ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Upload ISO to Release
        env:
          ISO_TAG: ${{ inputs.target == 'openwrt' && 'OpenWrt-Installer-x86_64-ISO' || 'Custom-Installer-x86_64-ISO' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.ISO_TAG }}
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
