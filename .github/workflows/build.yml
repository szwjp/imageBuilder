name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "目标固件 (ImmortalWrt 走 master 分支, OpenWrt 走 openwrt 分支)"
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      version:
        description: "固件版本号 (immortalwrt 目前仅 25.12.0/25.12.1 有镜像; 目标无对应 tag 会在构建前报错)"
        required: true
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - 25.12.3
          - 25.12.4
          - 25.12.5
      output_format:
        description: "输出格式"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - iso
      custom_router_ip:
        description: "路由器管理地址 (仅多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      profile:
        description: "固件大小 单位(MB)"
        required: true
        default: '1024'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build.sh

      - name: Validate inputs
        env:
          PROFILE: ${{ inputs.profile }}
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          if ! [[ "$PROFILE" =~ ^[0-9]+$ ]]; then
            echo "Error: profile 必须是数字 (MB)，不支持逗号分隔多尺寸"
            exit 1
          fi
          if ! [[ "$CUSTOM_ROUTER_IP" =~ ^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$ ]]; then
            echo "Error: custom_router_ip 必须是合法 IPv4 地址 (每段 0-255), 如 192.168.1.1"
            exit 1
          fi
          if [[ "$ENABLE_PPPOE" == "yes" ]]; then
            if [[ -z "$PPPOE_ACCOUNT" || -z "$PPPOE_PASSWORD" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
            # 黑名单校验: 仅拦截会破坏 shell source/uci 赋值的空白与 shell 元字符;
            # 其余字符(含中文等非 ASCII)放行, 避免误伤真实宽带账号
            BAD_CHARS=$(printf ' \t\n"\047\140$&|;<>()\134')
            check_pppoe_value() {
              local v="$1" label="$2" c i
              for ((i=0; i<${#BAD_CHARS}; i++)); do
                c="${BAD_CHARS:i:1}"
                if [[ "$v" == *"$c"* ]]; then
                  echo "Error: $label 含不允许的字符 (空白或 shell 元字符)"
                  exit 1
                fi
              done
            }
            check_pppoe_value "$PPPOE_ACCOUNT" pppoe_account
            check_pppoe_value "$PPPOE_PASSWORD" pppoe_password
            # 将密码加入日志脱敏
            echo "::add-mask::$PPPOE_PASSWORD"
          fi

      - name: Save Custom Router IP
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          printf '%s\n' "$CUSTOM_ROUTER_IP" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Build firmware
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          case "$TARGET" in
            immortalwrt)
              BRANCH=master
              WORK_DIR=/home/build/immortalwrt
              IMAGE="immortalwrt/imagebuilder:x86-64-openwrt-${VERSION}"
              CONFIG=x86-64/imm.config
              RELEASE_TAG=Autobuild-x86-64
              ISO_TAG=Custom-Installer-x86_64-ISO
              ;;
            openwrt)
              BRANCH=openwrt
              WORK_DIR=/builder
              IMAGE="openwrt/imagebuilder:x86-64-${VERSION}"
              CONFIG=x86-64/openwrt.config
              RELEASE_TAG=Autobuild-OpenWrt-x86-64
              ISO_TAG=OpenWrt-Installer-x86_64-ISO
              ;;
            *)
              echo "Error: unknown target '$TARGET'"
              exit 1
              ;;
          esac

          # 校验目标 imagebuilder tag 实际存在, 避免版本输入与已发布镜像不一致时到 docker run 才失败
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Error: 镜像 tag 不存在: $IMAGE"
            echo "请确认版本号 '$VERSION' 对 target=$TARGET 是否已发布"
            exit 1
          fi

          echo "Target: $TARGET | Branch: $BRANCH | Version: $VERSION | Image: $IMAGE"
          echo "Building for profile: $PROFILE (work_dir=$WORK_DIR)"
          git checkout "$BRANCH"

          # 校验目标分支源码文件存在, 避免 docker bind-mount 对缺失路径静默创建空目录
          for src in "$CONFIG" x86-64/build.sh shell/custom-packages.sh shell/prepare-packages.sh files/etc/uci-defaults/99-custom.sh; do
            if [ ! -f "$src" ]; then
              echo "Error: $src 在 $BRANCH 分支不存在, 目标分支与 workflow 不匹配"
              exit 1
            fi
          done

          # 敏感信息(PPPoE 密码)走 env-file, 避免出现在 docker run 进程列表/日志
          # trap 兜底: docker run 失败时也确保删除明文 env 文件
          trap 'rm -f .build.env' EXIT
          printf 'ROOTFS_PARTSIZE=%s\n' "$PROFILE" > .build.env
          printf 'BUILD_VERSION=%s\n' "$VERSION" >> .build.env
          printf 'INCLUDE_DOCKER=%s\n' "$INCLUDE_DOCKER" >> .build.env
          printf 'ENABLE_PPPOE=%s\n' "$ENABLE_PPPOE" >> .build.env
          printf 'PPPOE_ACCOUNT=%s\n' "$PPPOE_ACCOUNT" >> .build.env
          printf 'PPPOE_PASSWORD=%s\n' "$PPPOE_PASSWORD" >> .build.env

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:$WORK_DIR/bin" \
            -v "${{ github.workspace }}/files:$WORK_DIR/files" \
            -v "${{ github.workspace }}/custom:$WORK_DIR/files/etc/config" \
            -v "${{ github.workspace }}/$CONFIG:$WORK_DIR/.config" \
            -v "${{ github.workspace }}/shell:$WORK_DIR/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:$WORK_DIR/build.sh" \
            --env-file .build.env \
            -e WORK_DIR=$WORK_DIR \
            "$IMAGE" /bin/bash "$WORK_DIR/build.sh"
          rm -f .build.env

          # 传递 tag 给后续步骤
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Create info
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          VERSION: ${{ inputs.version }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: https://$CUSTOM_ROUTER_IP (nginx 主入口, 自签证书)
          - 🔗 **备用入口**: http://$CUSTOM_ROUTER_IP:8080 (uhttpd)
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **版本**: $VERSION (${{ env.TARGET }})
          EOF

          if [ "$INCLUDE_DOCKER" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload firmware as release (img)
        if: inputs.output_format == 'img'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy firmware for ISO
        if: inputs.output_format == 'iso'
        run: cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}/

      - name: Upload firmware artifact (for ISO)
        if: inputs.output_format == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: "*.img.gz"

  build_iso:
    runs-on: ubuntu-22.04
    needs: build
    if: inputs.output_format == 'iso'

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      - name: Clone img-installer (pinned)
        run: |
          # 供应链加固: 锁定到指定 commit, 升级时更新 SHA (git ls-remote https://github.com/wukongdaily/img-installer.git master)
          IMG_INSTALLER_REF=361ea6138094a2417e62edd01f73fa1160e93e01
          git clone --depth=1 https://github.com/wukongdaily/img-installer.git
          git -C img-installer fetch --depth=1 origin "$IMG_INSTALLER_REF"
          git -C img-installer checkout --detach "$IMG_INSTALLER_REF"

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: Build ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Upload ISO to Release
        env:
          ISO_TAG: ${{ inputs.target == 'openwrt' && 'OpenWrt-Installer-x86_64-ISO' || 'Custom-Installer-x86_64-ISO' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.ISO_TAG }}
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
