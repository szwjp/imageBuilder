name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 版本号"
        required: true
        default: "25.12.5"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - 25.12.3
          - 25.12.4
          - 25.12.5
      output_format:
        description: "输出格式"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - iso
      custom_router_ip:
        description: "路由器管理地址 (仅多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      profile:
        description: '固件大小 单位(MB)'
        required: true
        default: '1024'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: openwrt

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build.sh

      - name: Validate PPPoE Inputs
        run: |
          if ! [[ "${{ inputs.profile }}" =~ ^[0-9]+$ ]]; then
            echo "Error: profile 必须是数字 (MB)，不支持逗号分隔多尺寸"
            exit 1
          fi
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
            # 将密码加入日志脱敏, 避免 docker run 命令行泄露明文
            echo "::add-mask::${{ inputs.pppoe_password }}"
          fi

      - name: Save Custom Router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Build OpenWrt firmware
        run: |
          openwrt_version="${{ inputs.openwrt_version }}"
          profile="${{ inputs.profile }}"
          include_docker="${{ inputs.include_docker }}"

          echo "Building for profile: $profile (version=$openwrt_version)"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/builder/bin" \
            -v "${{ github.workspace }}/files:/builder/files" \
            -v "${{ github.workspace }}/custom:/builder/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/openwrt.config:/builder/.config" \
            -v "${{ github.workspace }}/shell:/builder/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/builder/build.sh" \
            -e ROOTFS_PARTSIZE=$profile \
            -e BUILD_VERSION=$openwrt_version \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            openwrt/imagebuilder:x86-64-${openwrt_version} /bin/bash /builder/build.sh

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: https://${{ inputs.custom_router_ip }} (nginx 主入口, 自签证书)
          - 🔗 **备用入口**: http://${{ inputs.custom_router_ip }}:8080 (uhttpd)
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **版本**: OpenWrt ${{ inputs.openwrt_version }}
          EOF

          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload firmware as release (img)
        if: inputs.output_format == 'img'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: Autobuild-OpenWrt-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy firmware for ISO
        if: inputs.output_format == 'iso'
        run: cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}/

      - name: Upload firmware artifact (for ISO)
        if: inputs.output_format == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: "*.img.gz"

  build_iso:
    runs-on: ubuntu-22.04
    needs: build
    if: inputs.output_format == 'iso'

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      - name: Clone img-installer
        run: git clone https://github.com/wukongdaily/img-installer.git

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: Build ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "OpenWrt-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
